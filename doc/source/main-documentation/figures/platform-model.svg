<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">A platform combines wiring and operating parameters</title>
  <desc id="desc">Hardware contains instruments and qubit-to-channel references. Parameters contains component configurations, native pulse templates, and execution defaults. Both feed into Platform, which manages connections and executes sequences.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#526078" stroke-width="1.5"/></marker>
  </defs>
  <rect width="760" height="380" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="17" fill="#243047">
    <rect x="24" y="24" width="340" height="174" rx="10" fill="#f0eaff" stroke="#7145bd"/>
    <text x="44" y="56" font-size="20" font-weight="bold">Hardware: what is connected</text>
    <text x="44" y="91">Instrument objects and channels</text>
    <text x="44" y="120">Qubits / couplers</text>
    <path d="M205 114 H244" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="254" y="120">channel IDs</text>
    <text x="44" y="166">Routing and component references</text>
    <rect x="396" y="24" width="340" height="174" rx="10" fill="#e8f4fa" stroke="#387c99"/>
    <text x="416" y="56" font-size="20" font-weight="bold">Parameters: how it is operated</text>
    <text x="416" y="91">Configurations keyed by component ID</text>
    <text x="416" y="126">Native pulse-sequence templates</text>
    <text x="416" y="161">Default shots and relaxation time</text>
    <path d="M194 198 V222 H300 V246" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M566 198 V222 H460 V246" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="180" y="252" width="400" height="104" rx="10" fill="#f4f5f8" stroke="#526078"/>
    <text x="380" y="284" text-anchor="middle" font-size="23" font-weight="bold">Platform</text>
    <text x="380" y="312" text-anchor="middle">Connect + execute sequences + disconnect</text>
    <text x="380" y="339" text-anchor="middle">Results keyed by acquisition ID</text>
  </g>
</svg>
