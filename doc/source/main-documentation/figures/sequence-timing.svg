<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">Piping versus concatenating pulse sequences</title>
  <desc id="desc">Preparation occupies a from 0 to 80 ns and b from 0 to 20 ns. Piping aligns a, b, and c at 80 ns, then b runs to 120 ns and c to 90 ns. Concatenation aligns only b and c at 20 ns, then b runs to 60 ns and c to 30 ns while a continues to 80 ns.</desc>
  <defs>
    <pattern id="delay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f5f8"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#9ba5b5" stroke-width="1"/></pattern>
  </defs>
  <rect width="760" height="450" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="17" fill="#243047">
    <rect x="28" y="20" width="22" height="18" rx="3" fill="#7145bd"/>
    <text x="60" y="35">Preparation</text>
    <rect x="220" y="20" width="22" height="18" rx="3" fill="#287c99"/>
    <text x="252" y="35">Next stage</text>
    <rect x="405" y="20" width="22" height="18" fill="url(#delay)" stroke="#9ba5b5"/>
    <text x="437" y="35">Synchronization delay</text>
    <text x="28" y="76" font-size="21" font-weight="bold">Piping: preparation | next_stage</text>
    <text x="28" y="118">a</text><text x="28" y="158">b</text><text x="28" y="198">c</text>
    <path d="M100 112 H700 M100 152 H700 M100 192 H700" stroke="#d9dfe8"/>
    <rect x="100" y="99" width="400" height="26" rx="3" fill="#7145bd"/>
    <rect x="100" y="139" width="100" height="26" rx="3" fill="#7145bd"/>
    <rect x="200" y="139" width="300" height="26" fill="url(#delay)" stroke="#9ba5b5"/>
    <rect x="100" y="179" width="400" height="26" fill="url(#delay)" stroke="#9ba5b5"/>
    <rect x="500" y="139" width="200" height="26" rx="3" fill="#287c99"/>
    <rect x="500" y="179" width="50" height="26" rx="3" fill="#287c99"/>
    <path d="M500 90 V211" stroke="#243047" stroke-width="2" stroke-dasharray="4 4"/>
    <g text-anchor="middle" font-size="16"><text x="100" y="233">0</text><text x="200" y="233">20</text><text x="500" y="233">80</text><text x="700" y="233">120 ns</text></g>
    <text x="28" y="279" font-size="21" font-weight="bold">Concatenation: preparation &lt;&lt; next_stage</text>
    <text x="28" y="321">a</text><text x="28" y="361">b</text><text x="28" y="401">c</text>
    <path d="M100 315 H700 M100 355 H700 M100 395 H700" stroke="#d9dfe8"/>
    <rect x="100" y="302" width="400" height="26" rx="3" fill="#7145bd"/>
    <rect x="100" y="342" width="100" height="26" rx="3" fill="#7145bd"/>
    <rect x="100" y="382" width="100" height="26" fill="url(#delay)" stroke="#9ba5b5"/>
    <rect x="200" y="342" width="200" height="26" rx="3" fill="#287c99"/>
    <rect x="200" y="382" width="50" height="26" rx="3" fill="#287c99"/>
    <path d="M200 293 V414" stroke="#243047" stroke-width="2" stroke-dasharray="4 4"/>
    <g text-anchor="middle" font-size="16"><text x="100" y="436">0</text><text x="200" y="436">20</text><text x="400" y="436">60</text><text x="500" y="436">80</text><text x="700" y="436">120 ns</text></g>
  </g>
</svg>
