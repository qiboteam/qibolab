<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">Excitation, idle time, and aligned readout</title>
  <desc id="desc">A Gaussian drive excitation occupies 0 to 40 ns; a drive delay occupies 40 to 140 ns. Piping the measurement inserts a 140 ns acquisition-channel delay before native MZ. The readout's duration is schematic. Its retained acquisition ID selects eight single-shot I/Q pairs.</desc>
  <defs>
    <pattern id="delay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f5f8"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#9ba5b5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#526078" stroke-width="1.5"/></marker>
  </defs>
  <rect width="760" height="350" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="17" fill="#243047">
    <text x="28" y="35" font-size="21" font-weight="bold">preparation | measurement</text>
    <text x="28" y="112">Drive</text><text x="28" y="181">Acquisition</text>
    <path d="M180 105 H704 M180 174 H704" stroke="#d9dfe8"/>
    <rect x="180" y="80" width="80" height="50" rx="4" fill="#f0eaff" stroke="#7145bd"/>
    <path d="M186 124 C198 124 202 89 220 89 S242 124 254 124" fill="none" stroke="#7145bd" stroke-width="3"/>
    <rect x="260" y="80" width="200" height="50" fill="url(#delay)" stroke="#9ba5b5"/>
    <text x="360" y="110" text-anchor="middle">Wait 100 ns</text>
    <rect x="180" y="149" width="280" height="50" fill="url(#delay)" stroke="#9ba5b5"/>
    <text x="320" y="179" text-anchor="middle">Inserted delay: 140 ns</text>
    <rect x="460" y="149" width="230" height="50" rx="4" fill="#e8f4fa" stroke="#387c99"/>
    <text x="575" y="179" text-anchor="middle">Native MZ readout</text>
    <path d="M460 63 V212" stroke="#243047" stroke-width="2" stroke-dasharray="4 4"/>
    <g text-anchor="middle"><text x="180" y="236">0</text><text x="260" y="236">40</text><text x="460" y="236">140 ns</text></g>
    <text x="575" y="258" text-anchor="middle" font-size="16">Readout width schematic</text>
    <rect x="145" y="277" width="470" height="49" rx="8" fill="#f4f5f8" stroke="#526078"/>
    <text x="167" y="307">results[readout.id]</text>
    <path d="M365 301 H414" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="434" y="307">8 shots x (I, Q)</text>
  </g>
</svg>
