# AI code review using GitHub Copilot CLI.
#
# Trigger: add the "run-qibobot" label to a pull request.
#
name: ai-review

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  ai-review:
    if: contains(github.event.pull_request.labels.*.name, 'run-qibobot')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot CLI review (BYOK)
        env:
          COPILOT_PROVIDER_BASE_URL: ${{ secrets.COPILOT_PROVIDER_BASE_URL }}
          COPILOT_PROVIDER_TYPE: openai
          COPILOT_PROVIDER_API_KEY: ${{ secrets.COPILOT_PROVIDER_API_KEY }}
          COPILOT_PROVIDER_MAX_PROMPT_TOKENS: ${{ secrets.COPILOT_PROVIDER_MAX_PROMPT_TOKENS }}
          COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: ${{ secrets.COPILOT_PROVIDER_MAX_OUTPUT_TOKENS }}
          COPILOT_MODEL: ${{ secrets.COPILOT_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot --yolo -p "/review PR #${PR_NUMBER}. Produce two files:
          1. review-summary.md: a concise, high-level markdown summary of your findings (no per-line detail, no code snippets).
          2. review-comments.json: a JSON array of objects for feedback tied to a specific line of the diff. Each object must have:
             - path: file path exactly as it appears in the diff, relative to the repo root.
             - line: the line number in the NEW version of the file.
             - side: \"RIGHT\" for added/context lines, \"LEFT\" for removed lines (default \"RIGHT\").
             - body: a markdown comment explaining the issue. When you can propose a concrete fix, include a \`\`\`suggestion fenced code block with the exact replacement code for that line (or line range).
          Only include comments for lines that are actually part of the pull request diff. If there is no line-specific feedback, write an empty array []." \
            --share=review-session.md

      - name: Post review comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          api_base = "https://api.github.com"

          def api_request(method, path, payload=None):
              url = f"{api_base}{path}"
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", "Bearer " + token)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode() or "null")

          def fetch_all(path):
              items = []
              page = 1
              while True:
                  sep = "&" if "?" in path else "?"
                  chunk = api_request("GET", f"{path}{sep}per_page=100&page={page}")
                  if not chunk:
                      break
                  items.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              return items

          def valid_lines_by_file():
              """Map each changed file to the set of (line, side) pairs that are
              part of the diff and can legally receive a review comment."""
              files = fetch_all(f"/repos/{repo}/pulls/{pr_number}/files")
              valid = {}
              hunk_re = re.compile(r"^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@")
              for f in files:
                  patch = f.get("patch")
                  if not patch:
                      continue
                  old_line = new_line = None
                  lines = set()
                  for raw in patch.splitlines():
                      m = hunk_re.match(raw)
                      if m:
                          old_line, new_line = int(m.group(1)), int(m.group(2))
                          continue
                      if old_line is None:
                          continue
                      if raw.startswith("\\ No newline at end of file"):
                          continue
                      if raw.startswith("+"):
                          lines.add((new_line, "RIGHT"))
                          new_line += 1
                      elif raw.startswith("-"):
                          lines.add((old_line, "LEFT"))
                          old_line += 1
                      else:
                          lines.add((new_line, "RIGHT"))
                          old_line += 1
                          new_line += 1
                  valid[f["filename"]] = lines
              return valid

          summary = ""
          if os.path.exists("review-summary.md"):
              with open("review-summary.md") as fh:
                  summary = fh.read().strip()
          if not summary:
              summary = "AI review completed, but no summary was produced."

          raw_comments = []
          if os.path.exists("review-comments.json"):
              try:
                  with open("review-comments.json") as fh:
                      raw_comments = json.load(fh)
                  if not isinstance(raw_comments, list):
                      raw_comments = []
              except (json.JSONDecodeError, OSError) as exc:
                  print(f"Could not parse review-comments.json: {exc}", file=sys.stderr)
                  raw_comments = []

          comments = []
          if raw_comments:
              valid = valid_lines_by_file()
              for c in raw_comments:
                  path = c.get("path")
                  body = c.get("body")
                  side = str(c.get("side") or "RIGHT").upper()
                  if side not in ("LEFT", "RIGHT"):
                      side = "RIGHT"
                  try:
                      line = int(c.get("line"))
                  except (TypeError, ValueError):
                      line = None
                  if not (path and line and body):
                      continue
                  # Defensively strip git-style a/ b/ prefixes some tools emit.
                  norm_path = re.sub(r"^[ab]/", "", path)
                  if (line, side) in valid.get(norm_path, set()):
                      comments.append({"path": norm_path, "line": line, "side": side, "body": body})
                  else:
                      print(f"Skipping out-of-diff comment: {path}:{line} ({side})", file=sys.stderr)

          try:
              try:
                  api_request(
                      "POST",
                      f"/repos/{repo}/pulls/{pr_number}/reviews",
                      {"body": summary, "event": "COMMENT", "comments": comments},
                  )
                  print(f"Posted review with {len(comments)} inline comment(s).")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode()
                  print(f"Review creation failed ({exc.code}): {detail}", file=sys.stderr)
                  print("Falling back to a plain issue comment with the summary only.", file=sys.stderr)
                  api_request("POST", f"/repos/{repo}/issues/{pr_number}/comments", {"body": summary})
          except Exception as exc:  # noqa: BLE001 - last-resort fallback, must not fail the job silently
              print(f"Unexpected error while posting review: {exc}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-output
          path: |
            review-summary.md
            review-comments.json
            review-session.md
          if-no-files-found: ignore
