name: tests

on:
  workflow_dispatch:
  push:
    branches-ignore: ["gh-readonly-queue/**"]
  merge_group:
  pull_request:
    types: [labeled, opened]

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-workflow')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
    uses: qiboteam/workflows/.github/workflows/test.yml@v3
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      doctests: ${{ matrix.os == 'ubuntu-latest'}}
      analyze: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
      uv-extras: "--no-dev --group docs --group tests --group analysis --all-extras"
    secrets: inherit
